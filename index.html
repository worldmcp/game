<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pludor World</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#102027;color:#fff;font:14px system-ui}canvas{width:100%;height:100%;display:block}.hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;gap:8px;padding:12px;align-items:center}.p,.panel,button{background:#07131dea;border:1px solid #ffffff20;color:#fff;border-radius:10px}.p{padding:9px 12px}.grow{flex:1}button{padding:9px 12px;cursor:pointer;font-weight:700}button:hover{background:#225675}.panel{position:absolute;padding:12px;pointer-events:auto}.left{left:12px;top:65px;width:225px}.right{right:12px;top:65px;width:270px}.bottom{left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:4px}.chat{left:12px;bottom:62px;width:300px}.muted{color:#9cb0bc;font-size:12px;line-height:1.4}.stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #ffffff12}.actions{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:8px}#toast{position:absolute;left:50%;bottom:68px;transform:translateX(-50%);padding:9px 14px;background:#07131df2;border:1px solid #fff2;border-radius:20px;opacity:0;transition:.2s}.modal{display:none;position:absolute;inset:0;background:#0008;align-items:center;justify-content:center;pointer-events:auto}.box{width:min(430px,90%);padding:18px}.close{float:right}@media(max-width:700px){.right,.chat{display:none}.left{width:190px}.p:nth-child(2),.p:nth-child(3){display:none}}</style></head>
<body><canvas id="c"></canvas><div class="hud"><div class="top"><div class="p"><b>PLUDOR</b> <span style="opacity:.5">WORLD</span></div><div class="p">👥 2,481</div><div class="p">💰 <b id="money">1,250</b></div><div class="p">⭐ <b id="xp">420</b></div><div class="grow"></div><button id="ai">Ask Pludor AI</button></div>
<div class="panel left"><b>NOVA CITY · CENTRAL</b><div class="muted">Playable commerce world</div><div class="stat">Energy <b id="energy">100</b></div><div class="stat">Social <b id="social">40</b></div><div class="stat">Items <b id="items">0</b></div><div class="actions"><button id="quest">Quest</button><button id="work">Work</button><button id="land">Land</button><button id="shop">Shop</button></div></div>
<div class="panel right"><b id="nearTitle">Explore</b><div class="muted" id="nearText">WASD / arrows to move. Walk near people or buildings. Press E to interact.</div><div class="actions" id="nearActions"></div></div>
<div class="panel chat"><div class="muted">PROXIMITY SOCIAL</div><div id="msgs"><div>Maya · Meet me at Market.</div><div>Jay · I have a creator gig.</div></div></div>
<div class="panel bottom"><button id="explore">Explore</button><button id="shops">Shops</button><button id="lands">Land</button><button id="games">Games</button><button id="socialBtn">Social</button><button id="ai2">AI</button></div><div id="toast"></div>
<div class="modal" id="modal"><div class="panel box"><button class="close" id="close">×</button><h2 id="mt"></h2><div class="muted" id="md"></div><div class="actions" id="ma"></div></div></div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),K={},S={x:1100,y:800,m:1250,xp:420,en:100,so:40,it:0,q:0};let W,H,d=1,last=0;
const B=[['Daily Grind',260,180,260,180,'#765b48','shop'],['Nova Market',1560,180,360,230,'#76546f','shop'],['Arcade',250,1130,300,210,'#426b63','game'],['Pludor Labs',1570,1100,340,240,'#485f88','ai'],['Creator Hub',880,90,440,190,'#6b5d49','work'],['Nova Mall',850,1130,430,220,'#3d5662','shop']];
const P=[['Maya',680,710,'#f18a62'],['Jay',1060,700,'#8f7ce0'],['Ayo',1360,820,'#65c990']],L=[[600,400],[790,400],[980,400],[600,1450],[800,1450],[1000,1450]];
function size(){d=Math.min(devicePixelRatio||1,2);c.width=innerWidth*d;c.height=innerHeight*d;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';x.setTransform(d,0,0,d,0,0);W=innerWidth;H=innerHeight}addEventListener('resize',size);size();
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.opacity=1;clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.opacity=0,1800)}
function modal(t,d,acts){mt.textContent=t;md.textContent=d;ma.innerHTML='';acts.forEach(a=>{let b=document.createElement('button');b.textContent=a[0];b.onclick=a[1];ma.appendChild(b)});modal.style.display='flex'}close.onclick=()=>modal.style.display='none';
function hud(){money.textContent=S.m;xp.textContent=S.xp;energy.textContent=Math.round(S.en);social.textContent=Math.round(S.so);items.textContent=S.it}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function action(){let best=null,bd=1e9;P.forEach(p=>{let q=dist(S,{x:p[1],y:p[2]});if(q<bd){bd=q;best=['p',p]}});B.forEach(b=>{let q=dist(S,{x:b[1]+b[3]/2,y:b[2]+b[4]/2});if(q<bd){bd=q;best=['b',b]}});if(bd>140){nearTitle.textContent='Explore';nearText.textContent='Find people, shops, gigs and land. Press E when close.';nearActions.innerHTML='';return}nearActions.innerHTML='';if(best[0]=='p'){let p=best[1];nearTitle.textContent=p[0]+' is nearby';nearText.textContent='Talk using Pludor messaging.';[['Text',()=>talk(p,false)],['Voice',()=>talk(p,true)],['Friend',()=>{S.so=Math.min(100,S.so+5);toast('+5 Social')}]].forEach(a=>{let b=document.createElement('button');b.textContent=a[0];b.onclick=a[1];nearActions.appendChild(b)})}else{let b=best[1];nearTitle.textContent=b[0];nearText.textContent=b[6]=='work'?'Creator jobs and gigs.':b[6]=='game'?'Games and challenges.':b[6]=='ai'?'AI and tools.':'Products, services and checkout.';let q=document.createElement('button');q.textContent=b[6]=='work'?'Find Gig':b[6]=='game'?'Play':'Enter';q.onclick=()=>b[6]=='work'?work():b[6]=='game'?game():shop(b);nearActions.appendChild(q)}}
function talk(p,v){msgs.innerHTML+='<div>You · '+(v?'Voice':'Text')+' with '+p[0]+'</div>';S.so=Math.min(100,S.so+3);toast(v?'Voice opened':'Message opened')}
function shop(b){modal(b[0], 'This world storefront represents an existing Pludor commerce surface.',[['Buy item · 40 PLD',()=>{if(S.m>=40){S.m-=40;S.it++;S.xp+=15;toast('Purchase complete +15 XP');modal.style.display='none'}else toast('Not enough PLD')}],['Orders',()=>toast('Orders opened')]])}
function work(){modal('Pludor Work Engine','UGC is one vertical of the broader work/gig system.',[['Complete creator gig +120 PLD',()=>{S.m+=120;S.xp+=70;S.en=Math.max(0,S.en-8);toast('+120 PLD +70 XP');modal.style.display='none'}],['Work board',()=>toast('Work board opened')]])}
function game(){modal('Arcade Challenge','Win the prototype challenge and earn XP.',[['Play · +100 XP',()=>{S.xp+=100;S.en=Math.max(0,S.en-5);toast('Challenge won +100 XP');modal.style.display='none'}],['Leaderboard',()=>toast('Leaderboard opened')]])}
function land(){let p=L.find(q=>!q[2]);if(p){p[2]=true;S.m=Math.max(0,S.m-100);S.xp+=50;S.x=p[0];S.y=p[1];toast('Parcel rented +50 XP')}else toast('All prototype parcels owned')}
function aiAct(){modal('Ask Pludor AI','World context lets Pludor AI recommend and perform actions.',[['Find work',()=>{S.x=1100;S.y=300;toast('AI routed you to Creator Hub');modal.style.display='none'}],['Find a shop',()=>{S.x=1740;S.y=330;toast('AI routed you to Market');modal.style.display='none'}],['Find people',()=>{S.x=700;S.y=700;toast('AI routed you to Social Plaza');modal.style.display='none'}]])}
function quest(){if(!S.q){S.q=1;S.xp+=10;toast('Quest: visit Daily Grind')}else if(S.q==1){S.q=2;S.x=390;S.y=430;S.xp+=30;toast('Quest step complete +30 XP')}else{S.q=0;S.m+=75;S.xp+=100;toast('Quest complete +75 PLD +100 XP')}}
function draw(t){let sx=S.x-W/2,sy=S.y-H/2;x.clearRect(0,0,W,H);x.fillStyle='#79aa6e';x.fillRect(0,0,W,H);const R=(a,b,w,h,col)=>{x.fillStyle=col;x.fillRect(a-sx,b-sy,w,h)};R(0,0,2200,1600,'#719e69');for(let i=0;i<2200;i+=320)R(i,0,90,1600,'#53666a');for(let i=0;i<1600;i+=280)R(0,i,2200,76,'#53666a');R(0,620,2200,210,'#8b948d');B.forEach(b=>{R(b[1]+8,b[2]+8,b[3],b[4],'#0004');R(b[1],b[2],b[3],b[4],b[5]);x.fillStyle='#b8d9dc';for(let yy=b[2]+28;yy<b[2]+b[4]-40;yy+=40)for(let xx=b[1]+25;xx<b[1]+b[3]-20;xx+=45)x.fillRect(xx-sx,yy-sy,18,20);x.fillStyle='#07131d';x.fillRect(b[1]-sx,b[2]+b[4]-32-sy,b[3],32);x.fillStyle='#fff';x.font='bold 14px system-ui';x.textAlign='center';x.fillText(b[0],b[1]+b[3]/2-sx,b[2]+b[4]-11-sy)});L.forEach(p=>{x.strokeStyle=p[2]?'#55d98a':'#f5c84b';x.lineWidth=3;x.setLineDash([7,5]);x.strokeRect(p[0]-70-sx,p[1]-45-sy,140,90);x.setLineDash([])});P.forEach(p=>{let px=p[1]-sx,py=p[2]-sy;x.fillStyle='#0005';x.beginPath();x.ellipse(px,py+20,17,7,0,0,7);x.fill();x.fillStyle=p[3];x.beginPath();x.arc(px,py,14,0,7);x.fill();x.fillStyle='#f0bd8b';x.beginPath();x.arc(px,py-17,9,0,7);x.fill();x.fillStyle='#fff';x.font='bold 12px system-ui';x.fillText(p[0],px,py-30)});let px=S.x-sx,py=S.y-sy;x.fillStyle='#0006';x.beginPath();x.ellipse(px,py+22,19,8,0,0,7);x.fill();x.fillStyle='#39a6df';x.beginPath();x.arc(px,py,16,0,7);x.fill();x.fillStyle='#f0bd8b';x.beginPath();x.arc(px,py-19,10,0,7);x.fill();x.strokeStyle='#fff';x.lineWidth=2;x.beginPath();x.arc(px,py,22,0,7);x.stroke();if(S.q){let qx=(S.q==1?390:S.x)-sx,qy=(S.q==1?420:S.y-70)-sy;x.fillStyle='#f5c84b';x.beginPath();x.arc(qx,qy,14+Math.sin(t/150)*3,0,7);x.fill();x.fillStyle='#07131d';x.font='bold 14px system-ui';x.fillText('!',qx,qy+5)}}
function loop(t){let dt=Math.min((t-last)/1000,.05);last=t;let dx=(K.d||K.arrowright?1:0)-(K.a||K.arrowleft?1:0),dy=(K.s||K.arrowdown?1:0)-(K.w||K.arrowup?1:0);if(dx||dy){let l=Math.hypot(dx,dy),sp=K.shift?300:190;S.x=Math.max(30,Math.min(2170,S.x+dx/l*sp*dt));S.y=Math.max(30,Math.min(1570,S.y+dy/l*sp*dt));S.en=Math.max(0,S.en-dt*(K.shift?1.5:.5))}draw(t);action();hud();requestAnimationFrame(loop)}addEventListener('keydown',e=>{K[e.key.toLowerCase()]=1;if(e.key.toLowerCase()=='e'&&!e.repeat){let p=P.find(p=>dist(S,{x:p[1],y:p[2]})<120);if(p)talk(p,false)}});addEventListener('keyup',e=>K[e.key.toLowerCase()]=0);
questBtn.onclick=quest;work.onclick=work;land.onclick=land;shop.onclick=()=>shop(B[1]);ai.onclick=aiAct;ai2.onclick=aiAct;shops.onclick=()=>shop(B[1]);lands.onclick=land;games.onclick=game;socialBtn.onclick=()=>{S.x=700;S.y=700;toast('Social Plaza')};explore.onclick=()=>toast('Explore with WASD / arrows');requestAnimationFrame(loop);
})();
</script></body></html>
